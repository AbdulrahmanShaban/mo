<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;font-family:Tahoma,Arial;color:#f5f9ff;background:radial-gradient(ellipse at 50% 10%,#17477d,#091b36 48%,#030812);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(80px);opacity:.25;animation:float 8s ease-in-out infinite alternate;pointer-events:none}body:before{background:#00d5ff;top:-130px;right:-100px}body:after{background:#315dff;bottom:-150px;left:-100px;animation-delay:-4s}
.card{position:relative;width:min(100%,430px);padding:34px 25px 28px;text-align:center;border:1px solid #72dfff55;border-radius:30px;background:linear-gradient(150deg,#18385edb,#050f20ed);box-shadow:0 25px 90px #0009,inset 0 1px 0 #ffffff20;overflow:hidden;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.orbit{position:absolute;width:270px;height:270px;border:1px solid #55e6ff35;border-radius:50%;top:-165px;left:50%;transform:translateX(-50%);animation:spin 18s linear infinite}.orbit:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#55e6ff;top:42px;left:37px;box-shadow:0 0 16px 5px #55e6ff88}
.avatar-wrap{position:relative;width:166px;height:166px;margin:0 auto 22px;padding:5px;border-radius:50%;background:conic-gradient(#55e6ff,#397bff,#b5f7ff,#55e6ff);box-shadow:0 0 0 8px #55e6ff0c,0 0 35px #1fbfff66;animation:glow 3s ease-in-out infinite}
.avatar{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;object-position:center 22%;border:4px solid #0b1c36}.spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#d8fbff;box-shadow:0 0 15px 4px #55e6ff;right:8px;top:24px;animation:blink 2s infinite}
h1{margin:0;font-size:27px;line-height:1.5;text-shadow:0 0 20px #6bdfff35;animation:fade .9s .2s both}.tag{margin:7px 0 27px;color:#a8c9e8;font-size:13px;letter-spacing:2px;animation:fade .9s .35s both}
.actions{display:grid;gap:13px}.action{display:flex;align-items:center;justify-content:center;gap:12px;min-height:60px;padding:15px 20px;border-radius:17px;text-decoration:none;color:#f7fcff;font-weight:bold;font-size:16px;border:1px solid #8ddfff66;background:linear-gradient(110deg,#1a4775bb,#10294bbb);box-shadow:0 8px 24px #0003,inset 0 1px 0 #ffffff20;transition:transform .25s,box-shadow .25s,border-color .25s;animation:fade .8s both;position:relative;overflow:hidden}.action:nth-child(1){animation-delay:.48s}.action:nth-child(2){animation-delay:.62s}.action:hover{transform:translateY(-4px);border-color:#8af1ff;box-shadow:0 12px 30px #00bfff40}.action svg{width:23px;height:23px;fill:currentColor}.wa{background:linear-gradient(110deg,#087b69bb,#104b52bb);border-color:#52e6c477}.call{background:linear-gradient(110deg,#245bc0bb,#203b82bb)}
footer{margin-top:26px;color:#7f9fbe;font-size:11px;letter-spacing:1px;animation:fade 1s .8s both}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}@keyframes glow{50%{box-shadow:0 0 0 12px #55e6ff0a,0 0 48px #1fbfff99}}@keyframes blink{50%{opacity:.35;transform:scale(.7)}}@keyframes float{to{transform:translate(55px,45px) scale(1.2)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
